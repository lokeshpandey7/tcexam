
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      TCEXAM_DB_TYPE: MYSQL
      TCEXAM_DB_HOST: db
      TCEXAM_DB_PORT: "3306"
      TCEXAM_DB_NAME: tcexam
      TCEXAM_DB_USER: tcexam
      TCEXAM_DB_PASSWORD: ${SERVICE_PASSWORD_64_DBPASS}

      TCEXAM_TABLE_PREFIX: tce_

      TCEXAM_PATH_HOST: ${TCEXAM_PUBLIC_URL}
      TCEXAM_PATH_TCEXAM: /
      TCEXAM_PATH_MAIN: /var/www/html/
      TCEXAM_STANDARD_PORT: "443"

    expose:
      - "80"

    volumes:
      - tcexam_fonts:/var/www/html/vendor/tecnickcom/tc-lib-pdf-font/target/fonts
      - tcexam_cache:/var/www/html/cache
      - tcexam_config_shared:/var/www/html/shared/config
      - tcexam_config_admin:/var/www/html/admin/config
      - tcexam_config_public:/var/www/html/public/config
      - tcexam_backups:/var/www/html/admin/backup

    # The original entrypoint installs TCExam first.
    # Remove the web installer before Apache starts.
    command:
      - sh
      - -c
      - |
        rm -rf /var/www/html/install
        exec apache2-foreground

  db:
    image: mariadb:11

    restart: unless-stopped

    environment:
      MARIADB_DATABASE: tcexam
      MARIADB_USER: tcexam
      MARIADB_PASSWORD: ${SERVICE_PASSWORD_64_DBPASS}
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_DBROOT}

    volumes:
      - tcexam_db:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  tcexam_db:
  tcexam_fonts:
  tcexam_cache:
  tcexam_config_shared:
  tcexam_config_admin:
  tcexam_config_public:
  tcexam_backups:
